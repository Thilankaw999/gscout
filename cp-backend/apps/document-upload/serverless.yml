service: document-upload
frameworkVersion: '3'

custom:
  webpack:
    webpackConfig: './webpack.config.js'
    includeModules: false
    packager: 'npm'
    excludeFiles: src/**/*.spec.js

plugins:
  - serverless-webpack
  - serverless-offline

provider:
  name: aws
  runtime: nodejs18.x
  timeout: 300 # 5 minutes
  memorySize: 1024
  stage: ${opt:stage, 'dev'}
  region: ${env:AWS_REGION, 'us-east-1'}
  environment:
    NODE_ENV: ${env:NODE_ENV, 'development'}
    STAGE: ${self:provider.stage}
    TFR_DOCUMENTS_BUCKET: ${env:TFR_DOCUMENTS_BUCKET}
    PROCESSING_EVENT_BUS: ${env:PROCESSING_EVENT_BUS}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: 
            - "arn:aws:s3:::${env:TFR_DOCUMENTS_BUCKET}/*"
        - Effect: Allow
          Action:
            - events:PutEvents
          Resource: 
            - "arn:aws:events:${self:provider.region}:*:event-bus/*"

functions:
  uploadTfrDocument:
    handler: src/main.handler
    events:
      - http:
          method: post
          path: /upload-tfr
          cors: true
      - http:
          method: get
          path: /upload-url
          cors: true

  getTfrDocuments:
    handler: src/main.handler
    events:
      - http:
          method: get
          path: /tfr-documents
          cors: true
      - http:
          method: get
          path: /tfr-documents/{troopId}
          cors: true
