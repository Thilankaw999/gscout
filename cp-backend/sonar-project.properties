sonar.projectName=Leap in! SLS Boilerplate
sonar.projectVersion=1.0.0
sonar.projectKey=mitra-sls-api
sonar.sources=./apps,./libs
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
sonar.tests=./apps,./libs
sonar.test.inclusions=**/*.spec.ts
sonar.coverage.exclusions=**/*spec.ts, **/main.ts, **/*api.module.ts, **/test/**.ts
sonar.ts.tsconfig.configPath=tsconfig.json
sonar.exclusions=**/node_modules/**